<style>

#pp-face-preview .pp-battery i,#pp-face-preview .pp-battery svg { width:21px;height:21px;color:var(--pp-accent); }

#pp-face-preview .pp-digital span { color:var(--pp-accent);padding:0 2px; }

#pp-face-preview .pp-app { color:#fff;border-radius:56px; }

  #pp-face-preview .pp-app-card span { font-size:5.95cqw; }#pp-face-preview .pp-app-card strong { font-size:9.52cqw;margin-top:2.08cqw; }

</style>
<script>
(() => {
  const root = document.getElementById('pp-face-preview');
  const marks = root.querySelector('.pp-dial-marks');
  for (let i = 0; i < 60; i++) { const tick = document.createElement('span'); tick.className = 'pp-tick'; tick.style.setProperty('--angle', (i * 6) + 'deg'); marks.appendChild(tick); }
  root.querySelector('.pp-refresh').addEventListener('click', event => { event.currentTarget.textContent = '示例已刷新'; root.querySelector('.pp-app-heading small').textContent = '2026-11-18 · 示例已刷新'; });
  const state = { accent: '#c8f080', battery: 62 };
  const render = () => { root.querySelectorAll('.pp-screen').forEach(screen => screen.style.setProperty('--pp-accent', state.accent)); root.querySelectorAll('.pp-battery-value').forEach(value => value.textContent = state.battery + '%'); root.querySelectorAll('.pp-quiet,.pp-dial').forEach(screen => screen.setAttribute('aria-label', screen.getAttribute('aria-label').replace(/电量\d+%/, '电量' + state.battery + '%'))); root.querySelector('.pp-rail div').style.height = state.battery + '%'; };
  render();
  if (globalThis.Tweak) { const tweak = new Tweak({ container: root, onChange: render }); tweak.addColorPicker(state, 'accent', { label: '表盘强调色' }); tweak.addSlider(state, 'battery', { label: '模拟手环电量', min: 0, max: 100, step: 1, unit: '%' }); }
})();
</script>
