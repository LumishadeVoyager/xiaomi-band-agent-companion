name: 开发任务
description: 需求、实现、验证或发布任务
title: "[任务] "
body:
  - type: textarea
    id: scope
    attributes:
      label: 范围与需求 ID
      description: 写明 P0/P1/P2、工作线、依赖及实际目标
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 可验证条件；自动检查与真机分别列出
    validations:
      required: true
  - type: textarea
    id: progress
    attributes:
      label: 进度与证据
      value: "状态：待开始\n实现：未开始\n验证：未执行\n阻塞：无已知"
