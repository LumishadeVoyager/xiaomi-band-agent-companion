name: Repository checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  internet-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud-relay/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: cloud-relay
      - run: npm run check
        working-directory: cloud-relay
      - run: npm run build
        working-directory: cloud-relay
      - run: node test/integration.mjs
        working-directory: cloud-relay
        env:
          WRANGLER_SEND_METRICS: 'false'
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
  audio-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: python -m py_compile host/transcribe.py scripts/build-android-probe.py
      - run: python -m pip install pycryptodome==3.23.0
      - run: python test/native_recorder_test.py
  wearable-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/band-agent-tools" --no-audit --no-fund aiot-toolkit@2.0.5 @aiot-toolkit/jsc@1.0.3
      - run: npm run build:wearable
        env:
          BAND_AGENT_TOOLS: ${{ runner.temp }}/band-agent-tools
      - run: npm run build:powerprofile
        env:
          BAND_AGENT_TOOLS: ${{ runner.temp }}/band-agent-tools
  android-update-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: curl --fail --location --output "$RUNNER_TEMP/json.jar" https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
      - run: python scripts/test-update-policy.py --json-jar "$RUNNER_TEMP/json.jar"

      - run: python scripts/test-powerprofile-notifications.py --jdk "$JAVA_HOME" --json-jar "$RUNNER_TEMP/json.jar"
